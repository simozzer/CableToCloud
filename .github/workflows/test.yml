name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Simulation and levels, with coverage thresholds (fails if coverage drops).
      - run: npm test
      # User interface, in the Google Chrome that GitHub's Ubuntu runners include.
      - run: npm run test:e2e

  mutation:
    # Checks the tests themselves: thousands of small deliberate bugs, each of which a test must catch.
    # Slower (several minutes), so it runs alongside the main job and doesn't hold it up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
